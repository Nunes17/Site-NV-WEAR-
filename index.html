<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NV WEAR | Moda Masculina</title>
  <link rel="stylesheet" href="style.css">  
</head>
    

    <body>

    <header>
        <h1>NV WEAR</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Marcas</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main>

        <h2>Moda masculina premium</h2>

        <p>Estilo, qualidade e personalidade.</p>

        <button>Ver produtos</button>

    </main>
<!-- SEÇÃO DE PRODUTOS DA NV WEAR -->
    <section class="produtos">
        <h2>Lançamentos</h2>

        <div class="grid-produtos">

            <!-- Card 1 -->
            <div class="card-produto">
                <img src="https://via.placeholder.com/250" alt="Camiseta Oversized">
                <h3>Camiseta Oversized</h3>
                <p class="preco">R$ 120,00</p>
                <button class="btn-comprar">Comprar</button>
            </div>

            <!-- Card 2 -->
            <div class="card-produto">
                <img src="https://via.placeholder.com/250" alt="Jaqueta Jeans">
                <h3>Jaqueta Jeans Premium</h3>
                <p class="preco">R$ 280,00</p>
                <button class="btn-comprar">Comprar</button>
            </div>

            <!-- Card 3 -->
            <div class="card-produto">
                <img src="https://via.placeholder.com/250" alt="Calça Cargo">
                <h3>Calça Cargo Street</h3>
                <p class="preco">R$ 190,00</p>
                <button class="btn-comprar">Comprar</button>
            </div>

        </div>
    </section>

</body>
</html>
